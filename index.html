<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>APC Lab System</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#0A2463">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="APC Lab">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="icon" type="image/png" href="./icon-192.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chartjs-plugin-datalabels/2.2.0/chartjs-plugin-datalabels.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{
  --ink:#1a2420;--ink-s:#4a5550;--ink-f:#8a9590;
  --paper:#f7f5f0;--raised:#ffffff;
  --line:#d8d4c8;--line-s:#b8b2a0;
  --moss:#f19719;--moss-d:#1a2420;--moss-p:#f2f2f2;
  --brand-blue:#0c2f66;--brand-blue-light:#8fb3e8;
  --rust:#a8542e;--rust-p:#f5e3d8;
  --amber:#b8893a;--amber-p:#f7eddb;
  --r:10px;
  --mono:"Courier New",monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box;}
html{min-height:100%;}
body{margin:0;min-height:100vh;background:var(--paper);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden;}
.app{max-width:720px;margin:0 auto;padding:0 16px 80px;width:100%;transition:max-width .15s;}
.app.wide-mode{max-width:1400px;}
header.top{padding:18px 16px 0;margin:0 -16px 24px;position:sticky;top:0;background:var(--brand-blue);z-index:10;}
.brand-row{display:flex;align-items:center;gap:12px;margin-bottom:14px;}
.brand-row img{height:32px;width:auto;}
.brand-row .div{width:1px;height:26px;background:rgba(255,255,255,0.25);}
.brand-row .tb .ey{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--brand-blue-light);margin:0;}
.brand-row .tb h1{font-size:18px;font-weight:700;margin:1px 0 0;color:#fff;}
nav.tabs{display:flex;gap:4px;border-bottom:1px solid rgba(255,255,255,0.15);}
nav.tabs button{font-family:var(--sans);font-size:14px;font-weight:600;color:rgba(255,255,255,0.55);background:none;border:none;padding:10px 14px 12px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;}
nav.tabs button.active{color:var(--moss);border-bottom-color:var(--moss);}
section.panel{display:none;}section.panel.active{display:block;}
.card{background:var(--raised);border:1px solid var(--line);border-radius:var(--r);padding:20px;margin-bottom:16px;}
.card h2{font-size:15px;font-weight:700;margin:0 0 14px;display:flex;align-items:center;gap:8px;}
.card h2 .num{font-family:var(--mono);font-size:11px;color:var(--raised);background:var(--moss);width:20px;height:20px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;}
.upload-zone{border:2px dashed var(--line-s);border-radius:var(--r);padding:28px 16px;text-align:center;cursor:pointer;transition:border-color .15s,background .15s;}
.upload-zone:hover,.upload-zone.drag{border-color:var(--moss);background:var(--moss-p);}
.upload-zone .icon{font-size:26px;margin-bottom:6px;}
.upload-zone p{margin:0;font-size:14px;color:var(--ink-s);}
.upload-zone p.sub{font-size:12px;color:var(--ink-f);margin-top:4px;}
input[type=file]{display:none;}
.preview-row{display:flex;gap:14px;align-items:flex-start;margin-top:14px;}
.preview-row img{width:100px;border-radius:8px;border:1px solid var(--line);flex-shrink:0;}
button.btn-primary{background:var(--moss);color:var(--raised);border:none;font-weight:600;width:100%;padding:12px;border-radius:8px;cursor:pointer;font-size:14px;font-family:var(--sans);}
button.btn-primary:disabled{background:var(--line-s);cursor:not-allowed;}
button.btn-primary:hover:not(:disabled){background:#c97d10;}
.status-line{font-family:var(--mono);font-size:12px;color:var(--moss);margin-top:10px;display:none;align-items:center;gap:6px;}
.status-line.show{display:flex;}
.spin{width:11px;height:11px;border:2px solid var(--moss-p);border-top-color:var(--moss);border-radius:50%;animation:spin .7s linear infinite;flex-shrink:0;}
@keyframes spin{to{transform:rotate(360deg);}}
.progress-bar{height:4px;background:var(--moss-p);border-radius:4px;margin-top:8px;overflow:hidden;display:none;}
.progress-bar .fill{height:100%;background:var(--moss);width:0%;transition:width .2s;}
.result-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px;}
.result-grid .stat{background:var(--moss-p);border-radius:8px;padding:14px 10px;text-align:center;}
.result-grid .stat .lbl{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--moss-d);opacity:.75;margin-bottom:4px;}
.result-grid .stat input.val{font-family:var(--sans);font-size:20px;font-weight:700;color:var(--moss-d);background:transparent;border:none;text-align:center;width:100%;outline:none;padding:0;}
.result-grid .stat input.val:focus{background:var(--raised);border-radius:4px;}
.result-grid .stat .unit{font-size:11px;color:var(--moss-d);opacity:.7;margin-top:2px;}
.result-grid .stat.ref{background:#f0f0f0;}
.result-grid .stat.ref input.val{color:var(--ink-s);font-size:16px;}
.low-conf input.val{color:var(--amber);}
.low-conf{background:var(--amber-p)!important;outline:2px solid var(--amber);}
.conf-note{font-size:12px;color:var(--amber);margin-top:8px;display:none;}
.conf-note.show{display:block;}
.err-box{background:var(--rust-p);border:1px solid var(--rust);color:var(--rust);border-radius:8px;padding:12px 14px;font-size:13px;margin-top:12px;display:none;}
.err-box.show{display:block;}
.ocr-raw{font-family:var(--mono);font-size:11px;color:var(--ink-f);background:var(--paper);border-radius:6px;padding:8px 10px;margin-top:8px;white-space:pre-wrap;max-height:90px;overflow-y:auto;display:none;}
.ocr-raw.show{display:block;}
.toggle-raw{font-size:12px;color:var(--moss);cursor:pointer;margin-top:8px;display:inline-block;text-decoration:underline;}
.field-row{display:flex;gap:10px;margin-top:12px;}
.field-row>div{flex:1;}
.field-row label{font-size:11px;color:var(--ink);font-weight:700;font-family:var(--mono);text-transform:uppercase;letter-spacing:.04em;display:block;margin-bottom:4px;}
.field-row input,.field-row select{font-family:var(--sans);font-size:14px;padding:9px 11px;border-radius:8px;border:1px solid var(--line-s);background:var(--raised);color:var(--ink);width:100%;}
.ref-note{font-size:11px;color:var(--ink-f);font-style:italic;margin-top:6px;padding-left:2px;}
button.btn{font-family:var(--sans);font-size:13px;padding:9px 13px;border-radius:8px;border:1px solid var(--line-s);background:var(--raised);color:var(--ink);cursor:pointer;}
button.btn:hover{background:var(--moss-p);border-color:var(--moss);}
.history-list{display:flex;flex-direction:column;gap:12px;}
.project-block{border:1px solid var(--line-s);border-radius:var(--r);margin-bottom:18px;overflow:hidden;background:var(--raised);}
.project-block.archived{opacity:.65;}
.project-block.archived .project-header{background:var(--ink-f);}
.archived-badge{font-size:10px;font-weight:400;background:rgba(255,255,255,.2);padding:2px 8px;border-radius:100px;margin-left:6px;vertical-align:middle;}
.archive-toggle-bar{margin-bottom:14px;}
.archive-toggle-bar button{width:100%;font-family:var(--sans);font-size:13px;padding:10px;border-radius:8px;border:1px dashed var(--line-s);background:var(--paper);color:var(--ink-s);cursor:pointer;}
.archive-toggle-bar button:hover{background:var(--moss-p);}
.project-header{background:var(--brand-blue);color:#fff;padding:12px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.project-title{font-family:var(--mono);font-weight:700;font-size:14px;flex:1;min-width:140px;}
.project-actions{display:flex;gap:6px;}
.project-actions button{font-family:var(--sans);font-size:11px;padding:6px 10px;border-radius:6px;border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.1);color:#fff;cursor:pointer;white-space:nowrap;}
.project-actions button:hover{background:rgba(255,255,255,.22);}
.project-chart-area{padding:12px 14px;border-bottom:1px solid var(--line);background:var(--paper);}
.chart-box{background:var(--raised);border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:12px;}
.chart-box:last-child{margin-bottom:0;}
.chart-box-title{font-size:11px;font-family:var(--mono);text-transform:uppercase;letter-spacing:.05em;color:var(--ink);font-weight:700;margin-bottom:8px;}
.chart-warning{background:var(--amber-p);border:1px solid var(--amber);border-radius:6px;padding:8px 10px;font-size:12px;color:var(--ink-s);}
.project-instruments{padding:10px 14px 14px;}
.instrument-subsection{margin-bottom:14px;}
.instrument-subsection:last-child{margin-bottom:0;}
.instrument-subheader{font-size:12px;font-weight:700;color:var(--ink);background:var(--moss-p);display:inline-block;padding:4px 10px;border-radius:6px;margin-bottom:8px;}
.empty-instrument-note{font-size:12px;color:var(--ink-f);font-style:italic;padding:6px 2px;}
.hv-edit{display:flex;flex-direction:column;gap:2px;background:var(--moss-p);border-radius:6px;padding:6px;text-align:center;}
.hv-edit label{font-family:var(--mono);font-size:9px;text-transform:uppercase;color:var(--ink);opacity:.7;}
.hv-edit input{width:100%;font-size:13px;padding:4px;border-radius:4px;border:1px solid var(--line-s);text-align:center;}
.edit-actions{grid-column:1/-1;display:flex;gap:8px;margin-top:8px;}
.btn-save-edit,.btn-cancel-edit{flex:1;font-size:12px;padding:8px;border-radius:6px;border:none;cursor:pointer;font-weight:600;}
.btn-save-edit{background:var(--moss);color:#fff;}
.btn-cancel-edit{background:var(--line);color:var(--ink);}
.code-group{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;}
.code-group-header{background:var(--brand-blue);color:var(--raised);padding:10px 14px;display:flex;align-items:center;justify-content:space-between;}
.code-group-header .code-label{font-family:var(--mono);font-size:13px;font-weight:700;}
.code-group-header .avg-badge{font-size:12px;background:rgba(255,255,255,.15);padding:3px 10px;border-radius:100px;}
.sample-list{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:10px;}
.hist-card{border:1px solid var(--line);border-radius:8px;padding:8px 6px;background:var(--raised);text-align:center;position:relative;}
.hist-card-top{display:flex;align-items:center;justify-content:space-between;gap:4px;margin-bottom:6px;}
.hist-card-top .sample-tag{font-family:var(--mono);font-size:11px;font-weight:700;color:var(--raised);background:var(--moss);width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;}
.hist-card-top .hist-date{display:none;}
.hist-card-top .hist-op{display:none;}
.row-del{background:none;border:none;cursor:pointer;color:var(--ink-f);font-size:18px;line-height:1;padding:4px 8px;min-width:32px;min-height:32px;border-radius:6px;}
.row-del:disabled{opacity:.3;cursor:not-allowed;}
.row-del:disabled:hover{color:var(--ink-f);background:none;}
.row-del:hover{color:var(--rust);background:var(--rust-p);}
.hist-values{display:flex;flex-direction:column;gap:4px;}
.hist-values-view{display:flex;flex-direction:column;gap:4px;cursor:pointer;border-radius:8px;padding:2px;transition:background .12s;}
.hist-values-view:hover{background:rgba(20,69,158,.06);}
.hist-values-view:active{background:rgba(20,69,158,.14);}
.hv{border-radius:6px;padding:8px 4px;text-align:center;}
.hv.primary{background:var(--moss-p);}
.hv.ref{background:#f0f0f0;}
.hv-k{display:block;font-family:var(--mono);font-size:9px;text-transform:uppercase;color:var(--moss-d);opacity:.7;}
.hv-v{display:block;font-size:16px;font-weight:700;color:var(--moss-d);}
.hv.ref .hv-v{font-size:13px;color:var(--ink-s);}
.hv-u{display:block;font-size:9px;color:var(--moss-d);opacity:.6;}
.avg-row{background:var(--amber-p);border-top:2px solid var(--amber);padding:10px 14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
.avg-row .avg-label{font-family:var(--mono);font-size:11px;color:var(--amber);text-transform:uppercase;font-weight:700;}
.avg-row .avg-val{font-family:var(--mono);font-size:14px;font-weight:700;color:var(--ink);}
.empty-state{text-align:center;padding:40px 20px;color:var(--ink-f);}
.sbl-list{display:flex;flex-direction:column;gap:10px;}
.sbl-card{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;background:var(--raised);}
.sbl-card-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px;}
.sbl-project-no{font-family:var(--mono);font-size:13px;font-weight:700;color:var(--brand-blue);}
.sbl-status-badge{font-size:10px;font-weight:700;color:#fff;padding:3px 9px;border-radius:100px;text-transform:uppercase;white-space:nowrap;}
.sbl-seg-app{font-size:12px;color:var(--ink-s);font-weight:600;margin-bottom:4px;}
.sbl-objective{font-size:13px;color:var(--ink);margin-bottom:8px;line-height:1.4;}
.sbl-meta-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:6px;}
.sbl-meta-grid > div{background:var(--paper);border-radius:6px;padding:5px 7px;}
.sbl-meta-k{display:block;font-family:var(--mono);font-size:8px;text-transform:uppercase;color:var(--ink-f);}
.sbl-meta-v{display:block;font-size:12px;color:var(--ink);font-weight:600;}
.sbl-product,.sbl-lims{font-size:11px;color:var(--ink-f);margin-top:4px;}

#wp-area{display:grid;grid-template-columns:1fr;gap:12px;}
.app.wide-mode #wp-area{grid-template-columns:repeat(2,1fr);}
.wp-card{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;background:var(--raised);margin-bottom:0;}
.wp-card-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px;}
.wp-project-no{font-family:var(--mono);font-size:13px;font-weight:700;color:var(--brand-blue);}
.wp-info{font-size:12px;color:var(--ink);line-height:1.6;margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid var(--line);}
.wp-info b{color:var(--ink);}
.wp-extra-fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:10px;}
.wp-extra-fields label{display:block;font-family:var(--mono);font-size:9px;text-transform:uppercase;color:var(--ink);margin-bottom:3px;font-weight:700;}
.wp-extra-fields input,.wp-extra-fields select{width:100%;font-family:var(--sans);font-size:13px;padding:7px 9px;border-radius:6px;border:1px solid var(--line-s);background:var(--paper);color:var(--ink);}
.wp-save-btn{width:100%;font-size:12px;padding:8px;border-radius:6px;border:none;background:var(--moss);color:#fff;cursor:pointer;font-weight:600;}
.sbl-card-actions{display:flex;gap:8px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line);}
.sbl-card-actions button{flex:1;font-size:12px;padding:8px;}
.sbl-del-btn{color:var(--rust);border-color:var(--rust-p);}
.sbl-del-btn:hover{background:var(--rust-p);}

.mr-layout{display:flex;height:calc(100vh - 190px);min-height:480px;border:1px solid var(--line-s);border-radius:var(--r);overflow:hidden;background:var(--raised);}
.mr-sidebar{width:210px;flex-shrink:0;background:var(--brand-blue);display:flex;flex-direction:column;padding:14px 0;}
.mr-sidebar-logo{padding:0 16px 14px;}
.mr-sidebar-logo img{width:100%;max-width:70px;display:block;margin:0 auto;background:#fff;border-radius:10px;padding:6px;}
.mr-menu-item{background:none;border:none;color:rgba(255,255,255,.65);text-align:left;padding:11px 16px;font-size:13px;cursor:pointer;font-family:var(--sans);border-left:3px solid transparent;white-space:nowrap;}
.mr-menu-item.active{background:rgba(255,255,255,.12);color:#fff;font-weight:700;border-left-color:var(--moss);}
.mr-menu-item:hover{background:rgba(255,255,255,.08);color:#fff;}
.mr-main{flex:1;overflow-y:auto;overflow-x:hidden;padding:16px;min-width:0;}
.mr-toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:16px;padding-bottom:14px;border-bottom:1px solid var(--line);}
.mr-section{display:none;}
.mr-section.active{display:block;}

@media (max-width:720px){
  .mr-layout{flex-direction:column;height:auto;min-height:0;}
  .mr-sidebar{width:100%;flex-direction:row;overflow-x:auto;padding:8px;align-items:center;}
  .mr-sidebar-logo{display:none;}
  .mr-menu-item{border-left:none;border-bottom:3px solid transparent;padding:8px 12px;}
  .mr-menu-item.active{border-left:none;border-bottom-color:var(--moss);}
  .mr-main{padding:12px;max-height:none;}
}
.empty-state .icon{font-size:32px;margin-bottom:10px;}
.empty-state p{margin:4px 0;font-size:13px;}
.toolbar{display:flex;gap:8px;margin-bottom:14px;}
.toolbar button.btn{flex:1;font-weight:600;}
.sync-status{font-size:12px;color:var(--ink-f);display:flex;align-items:center;gap:6px;margin-bottom:14px;}
.sync-dot{width:7px;height:7px;border-radius:50%;background:var(--line-s);flex-shrink:0;}
.sync-dot.ok{background:var(--moss);}.sync-dot.err{background:var(--rust);}
.sync-status a{color:var(--moss);cursor:pointer;text-decoration:underline;}
.help{font-size:12px;color:var(--ink-f);margin-top:6px;line-height:1.6;}
.mr-summary{color:var(--ink)!important;font-weight:600;}
input[type=url]{font-family:var(--sans);font-size:14px;padding:9px 11px;border-radius:8px;border:1px solid var(--line-s);background:var(--raised);color:var(--ink);width:100%;}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--raised);padding:10px 18px;border-radius:100px;font-size:13px;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;z-index:100;max-width:90%;text-align:center;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>
<div class="app">
